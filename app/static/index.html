<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GRU Text Generator</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, Segoe UI, sans-serif; }
    body { margin: 0; background: #0d1117; color: #f0f3f6; }
    main { max-width: 760px; margin: 48px auto; padding: 24px; }
    h1 { margin-bottom: 8px; font-size: clamp(1.8rem, 4vw, 2.5rem); }
    .muted { color: #9da7b3; }
    .panel { background: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 22px; margin-top: 24px; }
    label { display: block; font-weight: 600; margin: 14px 0 8px; }
    textarea, input, select { box-sizing: border-box; width: 100%; background: #0d1117; color: #f0f3f6; border: 1px solid #3d444d; border-radius: 8px; padding: 11px 12px; font: inherit; }
    textarea { min-height: 100px; resize: vertical; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    input[type=range] { padding: 0; accent-color: #f85149; }
    button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 8px; color: #fff; background: #238636; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #result { white-space: pre-wrap; line-height: 1.7; overflow-wrap: anywhere; }
    #error { color: #ff7b72; }
    a { color: #79c0ff; }
    @media (max-width: 560px) { main { margin: 12px auto; padding: 14px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>🧠 GRU Text Generator</h1>
  <p class="muted">Generate text using your trained GRU model, served by FastAPI.</p>
  <section class="panel">
    <form id="generator-form">
      <label for="prompt">Enter your prompt</label>
      <textarea id="prompt" maxlength="2000" required placeholder="Example: success comes from"></textarea>
      <div class="grid">
        <div><label for="sentences">Number of sentences</label><select id="sentences"><option>3</option><option selected>4</option><option>5</option></select></div>
        <div><label for="words">Maximum words per sentence</label><select id="words"><option>15</option><option selected>20</option><option>30</option><option>40</option></select></div>
        <div><label for="tokens">Maximum new tokens</label><select id="tokens"><option>60</option><option selected>120</option><option>180</option><option>250</option></select></div>
        <div><label for="topk">Top-k sampling</label><select id="topk"><option>4</option><option selected>8</option><option>12</option><option>20</option></select></div>
      </div>
      <label for="temperature">Creativity (temperature): <span id="temperature-value">0.8</span></label>
      <input id="temperature" type="range" min="0.3" max="1.5" step="0.1" value="0.8">
      <button id="submit-button" type="submit">✨ Generate text</button>
    </form>
    <p id="error" role="alert"></p>
  </section>
  <section class="panel" aria-live="polite">
    <h2>Generated text</h2>
    <p id="result" class="muted">Your generated text will appear here.</p>
  </section>
  <p class="muted">API documentation: <a href="/docs">/docs</a> · Readiness: <a href="/health/ready">/health/ready</a></p>
</main>
<script>
  const form = document.querySelector('#generator-form');
  const temp = document.querySelector('#temperature');
  temp.addEventListener('input', () => document.querySelector('#temperature-value').textContent = Number(temp.value).toFixed(1));
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = document.querySelector('#submit-button');
    const errorBox = document.querySelector('#error');
    const result = document.querySelector('#result');
    errorBox.textContent = '';
    button.disabled = true;
    button.textContent = 'Generating…';
    result.textContent = '';
    try {
      const response = await fetch('/api/v1/generate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt: document.querySelector('#prompt').value,
          sentence_count: Number(document.querySelector('#sentences').value),
          max_words_per_sentence: Number(document.querySelector('#words').value),
          max_new_tokens: Number(document.querySelector('#tokens').value),
          temperature: Number(temp.value), top_k: Number(document.querySelector('#topk').value)
        })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || 'Request failed');
      result.textContent = data.generated_text;
      result.classList.remove('muted');
    } catch (error) {
      errorBox.textContent = error.message || 'Could not generate text.';
      result.textContent = 'No output yet.';
    } finally {
      button.disabled = false;
      button.textContent = '✨ Generate text';
    }
  });
</script>
</body>
</html>
